<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — Onextap</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
</head>
<body>

<!-- The page Vercel serves for an address that leads nowhere (it uses the
     build's 404.html). A company page in all but name: the landing page's
     cursor, nav spine, menu and header row, over the ink band
     (src/pages/sub-page.js). Its asset paths are absolute (Vite's base is
     '/'), so it renders at any depth. -->
<div data-mount="cursor"></div>
<div data-mount="nav"></div>
<div data-mount="hud"></div>
<div class="sub-bar" data-header-row aria-hidden="true"></div>

<!-- What the open menu covers (and holds inert). -->
<div class="sub" data-page>
  <main id="top" data-chapter="Lost — 404">
    <div data-mount="not-found"></div>
  </main>
  <div data-mount="page-foot"></div>
</div>

<div data-mount="login"></div>

<script type="module" src="/src/pages/not-found/not-found.js"></script>
</body>
</html>
