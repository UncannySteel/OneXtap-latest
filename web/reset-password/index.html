<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — Onextap</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
</head>
<body>

<!-- Where the password-reset email's link opens (src/app/backend.js sends
     it here; it must be on Supabase's redirect allowlist). A company page in
     its frame (src/pages/sub-page.js), holding the sign-in window's card. -->
<div data-mount="cursor"></div>
<div data-mount="nav"></div>
<div data-mount="hud"></div>
<div class="sub-bar" data-header-row aria-hidden="true"></div>

<!-- What the open menu covers (and holds inert). -->
<div class="sub" data-page>
  <main id="top" data-chapter="Account — Password">
    <div data-mount="reset-password"></div>
  </main>
  <div data-mount="page-foot"></div>
</div>

<div data-mount="login"></div>

<script type="module" src="/src/pages/reset-password/reset-password.js"></script>
</body>
</html>
