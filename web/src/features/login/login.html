<!-- The sign-in window. Any [data-login] button opens it (the header's Log
     in). Forest-black like the stage, rather than the other windows' paper:
     a serif welcome over a raised moss card holding the form. "Sign up"
     turns the same window into the sign-up form. -->
<div class="dlg login" id="login" data-lenis-prevent inert>
  <div class="dlg__scrim" data-dlg-close></div>

  <div class="dlg__win" role="dialog" aria-modal="true" aria-labelledby="loginTitle" aria-describedby="loginIntro">
    <button class="dlg__x login__x" type="button" data-dlg-close aria-label="Close sign-in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="login__body" id="loginView">
      <h2 class="login__title" id="loginTitle">Welcome back</h2>
      <p class="login__intro" id="loginIntro">Sign in to access your dashboard.</p>

      <div class="login__card">
        <button class="login__google" type="button" id="loginGoogle">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <p class="login__or" aria-hidden="true"><span>or</span></p>

        <form class="login__form" id="loginForm" novalidate>
          <div class="login__field">
            <input class="login__inp" id="loginEmail" name="email" type="email" autocomplete="email"
                   inputmode="email" required aria-label="Email address"
                   aria-describedby="loginEmailErr" placeholder="Email address">
            <p class="login__err" id="loginEmailErr"></p>
          </div>

          <div class="login__field">
            <div class="login__pw">
              <input class="login__inp" id="loginPassword" name="password" type="password"
                     autocomplete="current-password" required aria-label="Password"
                     aria-describedby="loginPasswordErr" placeholder="Password">
              <button class="login__show" type="button" id="loginShow"
                      aria-controls="loginPassword" aria-pressed="false" aria-label="Show password">Show</button>
            </div>
            <p class="login__err" id="loginPasswordErr"></p>
          </div>

          <p class="login__err login__err--send" id="loginSendErr" role="alert"></p>
          <button class="login__submit" type="submit" id="loginSubmit">Sign In</button>
        </form>

        <p class="login__switch">
          <span id="loginAsk">Don’t have an account?</span>
          <button class="login__link" type="button" id="loginSwitch">Sign up</button>
        </p>
      </div>
    </div>

    <div class="login__body login__done" id="loginDone" hidden>
      <h2 class="login__title" id="loginDoneTitle" tabindex="-1">You’re in.</h2>
      <p class="login__intro" id="loginDoneText"></p>
      <button class="login__submit" type="button" data-dlg-close>Continue</button>
    </div>
  </div>
</div>
