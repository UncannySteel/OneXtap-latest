        - generic [ref=e30]: on a screen.
      - paragraph [ref=e31]: Same week, over and over, until you can't tell them apart. You keep meaning to do the thing, go to the place, become the person, and somehow it’s always next week. The loop is comfortable, which is the problem, because comfortable is how a whole year slips by with nothing in it worth remembering.
  - generic [ref=e32]:
    - heading "Quest accepted. Clock's running." [level=2] [ref=e33]
    - paragraph [ref=e34]: Now there’s a clock on it. Forty-eight hours to go do the thing, because “later” is how every one of these dies.
    - paragraph [ref=e35]: Not 24, since a day is too easy to lose to work or weather or a bad mood. Two days gives you room to fit it into a real life, and keeps it tight enough that you can’t quietly let it slide. The clock is there to turn someday into this week.
